<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../ds-bundle/styles.css" />
<link rel="stylesheet" href="../ds-bundle/_ds_bundle.css" />
<script src="../ds-bundle/_vendor/react.js"></script>
<script src="../ds-bundle/_vendor/react-dom.js"></script>
<script src="../ds-bundle/_ds_bundle.js"></script>
<style>
  body { margin:0; background:#d9d7cc; font-family:"Gotham",Montserrat,Arial,sans-serif; padding:20px; }
  .lbl { font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:#3B5344; margin:0 0 10px; }
  .row { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; align-items:start; }
</style>
</head>
<body><div id="root"></div>
<script>
const M = window.MilongaEmailDS, h = React.createElement;
const card=(label,el)=>h('div',null,h('div',{className:'lbl'},label),el);
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div',{className:'row'},
    card('Promo — dark green', h(M.PromoEmail,{bg:'forest'})),
    card('Educational — beige', h(M.EducationalEmail,{bg:'beige'})),
    card('Launch — gold', h(M.LaunchEmail,{bg:'gold'})),
    card('Story — dark green', h(M.StorytellingEmail,{bg:'forest'}))
  )
);
</script>
</body>
</html>
