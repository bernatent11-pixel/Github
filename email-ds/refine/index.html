<!doctype html>
<html><head><meta charset="utf-8" />
<link rel="stylesheet" href="../ds-bundle/styles.css" />
<link rel="stylesheet" href="../ds-bundle/_ds_bundle.css" />
<script src="../ds-bundle/_vendor/react.js"></script>
<script src="../ds-bundle/_vendor/react-dom.js"></script>
<script src="../ds-bundle/_ds_bundle.js"></script>
<style>
 body{margin:0;background:#d9d7cc;font-family:"Gotham",Montserrat,Arial,sans-serif;padding:18px}
 .lbl{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#3B5344;margin:0 0 8px}
 .row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
</style></head><body><div id="root"></div>
<script>
const M=window.MilongaEmailDS,h=React.createElement;
const card=(l,e)=>h('div',null,h('div',{className:'lbl'},l),e);

// A hand-built mixed-background email: dark green -> gold -> dark green
function Mixed(){
 const S=[{label:'Instagram',href:'#'},{label:'TikTok',href:'#'},{label:'Shop',href:'#'}];
 return h(M.EmailShell,{bg:'forest'},
  h(M.Header,{bg:'forest'}),
  h(M.Hero,{bg:'forest',eyebrow:'Limited time',title:'Your focus, 20% sharper',
    body:'Take 20% off your first tin of Milonga Yerba Mate Latte.',
    image:{kind:'lifestyle'},cta:{label:'Shop the launch',href:'#'}}),
  h(M.SectionBreak,{from:'forest',to:'gold'}),
  h(M.Section,{bg:'gold',pad:'lg'},
    h(M.SectionHeading,{bg:'gold',eyebrow:'Why it works',title:'Clean energy, all day'}),
    h('div',{style:{height:18}}),
    h(M.BenefitsGrid,{bg:'gold',columns:2,items:[
      {icon:'bolt',title:'Clean caffeine',text:'100mg from yerba mate — no coffee spike.'},
      {icon:'brain',title:"Lion's Mane",text:'300mg for focus and clarity.'}]}),
    h('div',{style:{height:20}}),
    h(M.Stats,{bg:'gold',items:[{value:'100mg',label:'Caffeine'},{value:'300mg',label:"Lion's Mane"},{value:'15',label:'Servings'}]})),
  h(M.SectionBreak,{from:'gold',to:'forest'}),
  h(M.Section,{bg:'forest',pad:'md'},
    h(M.SectionHeading,{bg:'forest',title:'What is inside every serving'}),
    h('div',{style:{height:14}}),
    h(M.Panel,{bg:'forest'},h(M.IngredientList,{bg:'forest',items:[
      {name:"Lion's Mane",amount:'300mg',note:'Focus & clarity'},
      {name:'L-Theanine',amount:'300mg',note:'Calm, no jitters'}]}))),
  h(M.Section,{bg:'forest',pad:'sm',align:'center'},h(M.Button,{bg:'forest',label:'Claim your 20%',size:'lg'})),
  h(M.Footer,{bg:'forest',social:S}));
}

ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'row'},
 card('MIXED bg — green→gold→green',h(Mixed)),
 card('Educational — beige + forest band',h(M.EducationalEmail,{bg:'beige',accentBg:'forest'})),
 card('Launch — gold (recolored)',h(M.LaunchEmail,{bg:'gold'})),
 card('Promo — dark green (2-tone titles)',h(M.PromoEmail,{bg:'forest'}))));
</script></body></html>
