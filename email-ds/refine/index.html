<!doctype html>
<html><head><meta charset="utf-8" />
<link rel="stylesheet" href="../ds-bundle/styles.css" />
<link rel="stylesheet" href="../ds-bundle/_ds_bundle.css" />
<script src="../ds-bundle/_vendor/react.js"></script>
<script src="../ds-bundle/_vendor/react-dom.js"></script>
<script src="../ds-bundle/_ds_bundle.js"></script>
<style>
 body{margin:0;background:#d9d7cc;font-family:"Gotham",Montserrat,Arial,sans-serif;padding:20px}
 .lbl{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#3B5344;margin:0 0 8px}
 .row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
 .pad{padding:26px 28px}
</style></head><body><div id="root"></div>
<script>
const M=window.MilongaEmailDS,h=React.createElement,FILL=M.bgFill;
const wrap=(bg,el)=>h('div',{style:{background:FILL[bg]},className:'pad milonga-email'},el);
const card=(label,el)=>h('div',null,h('div',{className:'lbl'},label),el);
const BG=['forest','gold','beige'];
const BEN=[{icon:'bolt',title:'Clean caffeine',text:'100mg from yerba mate — no coffee spike.'},
 {icon:'brain',title:"Lion's Mane",text:'300mg for focus and clarity.'}];
const set=(name,fn)=>h('div',{className:'row'},BG.map(bg=>card(name+' — '+bg,wrap(bg,fn(bg)))));

ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment,null,
 set('Buttons + stats',bg=>h('div',null,
   h(M.Button,{bg,label:'Shop the launch',size:'lg'}),
   h('div',{style:{height:18}}),
   h(M.Stats,{bg,items:[{value:'100mg',label:'Caffeine'},{value:'300mg',label:"Lion's Mane"},{value:'15',label:'Servings'}]}))),
 h('div',{style:{height:20}}),
 set('Raised benefit cards',bg=>h(M.BenefitsGrid,{bg,columns:2,items:BEN})),
 h('div',{style:{height:20}}),
 set('Bar chart',bg=>h(M.BarChart,{bg,max:220,data:[{label:'Milonga',value:100,suffix:'mg',highlight:true},{label:'Drip coffee',value:165,suffix:'mg'},{label:'Energy drink',value:200,suffix:'mg'}]})),
 h('div',{style:{height:20}}),
 set('Energy curve',bg=>h(M.EnergyCurve,{bg,xLabels:['8am','11am','2pm','5pm','8pm'],
   series:[{label:'Coffee',points:[20,95,40,18,10]},{label:'Milonga',points:[22,70,72,60,32],highlight:true}]})),
 h('div',{style:{height:20}}),
 set('Steps — numerals',bg=>h(M.Steps,{bg,items:[{title:'One scoop',text:'Add a scoop to your cup.'},{title:'Add hot water',text:'Stir for 10 seconds.'}]})),
 h('div',{style:{height:20}}),
 set('Steps — discs',bg=>h(M.Steps,{bg,variant:'discs',items:[{title:'One scoop',text:'Add a scoop to your cup.'},{title:'Add water',text:'Stir 10 seconds.'},{title:'Sip',text:'Four hours of focus.'}]})),
 h('div',{style:{height:20}}),
 set('Versus + panel',bg=>h('div',null,
   h(M.VersusBlock,{bg,left:{label:'Coffee at 3pm',points:['Spike, then crash','Jitters']},right:{label:'Milonga at 3pm',points:['Steady lift','Calm focus']}}),
   h('div',{style:{height:16}}),
   h(M.Panel,{bg},h(M.IngredientList,{bg,items:[{name:"Lion's Mane",amount:'300mg',note:'Focus & clarity'},{name:'L-Theanine',amount:'300mg',note:'Calm, no jitters'}]}))))
));
</script></body></html>
