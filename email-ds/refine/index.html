<!doctype html>
<html><head><meta charset="utf-8" />
<link rel="stylesheet" href="../ds-bundle/styles.css" />
<link rel="stylesheet" href="../ds-bundle/_ds_bundle.css" />
<script src="../ds-bundle/_vendor/react.js"></script>
<script src="../ds-bundle/_vendor/react-dom.js"></script>
<script src="../ds-bundle/_ds_bundle.js"></script>
<style>
 body{margin:0;background:#d9d7cc;font-family:"Gotham",Montserrat,Arial,sans-serif;padding:20px}
 .lbl{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#3B5344;margin:0 0 8px}
 .row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
 .pad{padding:30px 28px}
 h2{font-size:30px;font-weight:900;line-height:1.15;margin:0;text-transform:uppercase;letter-spacing:.015em}
 .sub{font-size:13px;margin:12px 0 0;line-height:1.6}
</style></head><body><div id="root"></div>
<script>
const M=window.MilongaEmailDS,h=React.createElement,C=M.colors;
const card=(l,e)=>h('div',null,h('div',{className:'lbl'},l),e);
const gold={background:C.gold};
function T({title,body,shadow}){return h('div',{className:'pad milonga-email',style:gold},
 h('h2',{style:{color:title,textShadow:shadow}},'Meet Milonga Vanilla Latte'),
 h('p',{className:'sub',style:{color:C.forest}},'Clean, focused energy in a smooth vanilla latte.'));}
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'row'},
 card('1 — Beige title (current)',h(T,{title:C.beige,shadow:'0 2px 12px rgba(90,62,10,.45)'})),
 card('2 — Beige + stronger shadow',h(T,{title:C.beige,shadow:'0 2px 6px rgba(0,53,27,.55), 0 4px 22px rgba(0,53,27,.35)'})),
 card('3 — White title',h(T,{title:C.white,shadow:'0 2px 10px rgba(90,62,10,.4)'}))));
</script></body></html>
