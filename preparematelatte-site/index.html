<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Milonga</title>
  <meta name="description" content="Milonga — something's brewing." />
  <meta name="robots" content="noindex" />

  <meta property="og:title" content="Milonga" />
  <meta property="og:description" content="Something's brewing." />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <!--
    QR / business-card destination for preparematelatte.milonga.life.
    This is a holding page only — the real landing page has not been designed
    yet. Replace everything inside <body> (and the <title>/meta above) when the
    design lands, keeping it at the domain root. Do NOT change or delete the
    CNAME file: this domain is printed on business cards.
  -->
  <style>
    :root {
      --gold-1:   #ecc96f;
      --gold-2:   #d6ab50;
      --gold-3:   #b98e38;
      --cream:    #f7efe0;
      --forest-1: #2f7a45;
      --forest-2: #1b5130;
      --forest-3: #0e3a20;
      --ink:      #123320;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 32px;
      font-family: "Inter", system-ui, sans-serif;
      color: var(--forest-3);
      background: radial-gradient(120% 90% at 50% 0%, var(--gold-1), var(--gold-2) 55%, var(--gold-3) 100%);
      -webkit-font-smoothing: antialiased;
    }

    /* paper-cut texture, same as the main site */
    body::before {
      content: "";
      position: fixed; inset: 0;
      background-image: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.06) 1px, transparent 1.4px);
      background-size: 14px 14px;
      pointer-events: none;
    }

    main { position: relative; text-align: center; }

    .logo {
      display: inline-flex; align-items: center; gap: 12px;
      font-family: "Fredoka", system-ui, sans-serif; font-weight: 700;
      font-size: clamp(34px, 9vw, 54px); letter-spacing: .5px;
      color: var(--forest-2);
    }
    .logo .mark { width: 1em; height: 1em; }

    .tag {
      margin-top: 18px;
      font-family: "Fredoka", system-ui, sans-serif; font-weight: 600;
      font-size: clamp(15px, 3.6vw, 18px);
      color: var(--forest-3);
    }

    .eyebrow {
      display: inline-flex; align-items: center; gap: 9px;
      margin-top: 28px;
      font-family: "Fredoka", system-ui, sans-serif; font-weight: 600;
      font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
      color: var(--forest-3);
      background: rgba(255,255,255,0.35);
      border: 1px solid rgba(18,51,32,0.18);
      border-radius: 100px; padding: 7px 16px;
    }
    .eyebrow .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--forest-2); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    @media (prefers-reduced-motion: reduce) { .eyebrow .dot { animation: none; } }
  </style>
</head>
<body>
  <main>
    <span class="logo">
      <svg class="mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <path d="M24 6c-2 6-2 10 0 16 2-6 2-10 0-16z" fill="#1b5130"/>
        <path d="M24 18c-3 4-4 9-4 16h8c0-7-1-12-4-16z" fill="#2f7a45"/>
        <path d="M14 20c2 8 4 11 8 14-2-7-4-11-8-14zM34 20c-2 8-4 11-8 14 2-7 4-11 8-14z" fill="#1b5130"/>
      </svg>
      Milonga
    </span>

    <p class="tag">Something's brewing.</p>

    <span class="eyebrow"><span class="dot"></span> Coming soon</span>
  </main>
</body>
</html>
